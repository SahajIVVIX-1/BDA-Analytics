[project]
name = "social-media-big-data-backend"
version = "1.0.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:starlette.*", "ignore:Using `httpx`"]

[tool.ruff]
line-length = 140
target-version = "py311"
extend-include = ["../scripts/*.py", "../experiments/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
  "B008",    # FastAPI's Depends()/Query() in defaults is the intended pattern
  "SIM105", "SIM108", "SIM113",  # style preferences, not bugs
]

[tool.ruff.lint.per-file-ignores]
"../experiments/*.py" = ["B023"]  # timing lambdas are called immediately inside the loop
